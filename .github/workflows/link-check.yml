name: Link check

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday
  workflow_dispatch:
  pull_request:
    paths: ["**/*.md"]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,429 --exclude 'localhost' --exclude 'img.shields.io' --exclude 'buymeacoffee.com' './**/*.md'
          fail: false
