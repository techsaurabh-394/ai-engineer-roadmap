name: Pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/anim_*.py"
      - "scripts/gen_animations.py"
      - "scripts/build_site.py"
      - "scripts/build_quiz.py"
      - "scripts/quiz_core.py"
      - "scripts/quiz_links.json"
      - "scripts/site_data.py"
      - "scripts/site/**"
      - "0[1-7]-*/code/*.py"
      - "0[1-7]-*/README.md"
      - "**/topics/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_animations.py
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
