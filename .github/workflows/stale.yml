name: Close stale issues

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "This issue has had no activity for 60 days. It will close in 14 days unless there is an update."
          stale-pr-message: "This pull request has had no activity for 60 days. It will close in 14 days unless there is an update."
          exempt-issue-labels: "pinned,good first issue"
