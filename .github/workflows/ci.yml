name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  mcp-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-mcp/code/hello-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 06-mcp/code/hello-mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build

  svg-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SVG diagrams
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("assets/*.svg"))
          assert files, "no SVG files found"
          for f in files:
              ET.parse(f)
              print("valid", f)
          PY

  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links to local files in Markdown
        run: |
          python - <<'PY'
          import os, re, subprocess, sys, urllib.parse
          files = [f for f in subprocess.run(["git", "ls-files", "*.md"], capture_output=True, text=True, check=True).stdout.split("\n") if f]
          bad = []
          for f in files:
              text = re.sub(r"```.*?```", "", open(f, encoding="utf-8").read(), flags=re.S)
              for m in re.finditer(r"\]\(([^)\s]+)\)|(?:src|href)=\"([^\"]+)\"", text):
                  u = m.group(1) or m.group(2)
                  if u.startswith(("http", "mailto:", "#")):
                      continue
                  p = urllib.parse.unquote(u.split("#")[0])
                  if p and not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f), p))):
                      bad.append(f + " -> " + u)
          print("checked", len(files), "markdown files")
          for b in bad:
              print("BROKEN:", b)
          sys.exit(1 if bad else 0)
          PY
