<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Cosine similarity</title>
<desc id="d">The angle between two embedding vectors tells you how similar their meaning is.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9DA7B3"/></marker></defs>
<rect width="880" height="380" rx="16" fill="#0D1117"/>
<text x="440.0" y="40" font-size="22" fill="#E6EDF3" font-weight="700" text-anchor="middle">Cosine similarity</text>
<text x="440.0" y="64" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">The angle between two embedding vectors tells you how similar their meaning is.</text>
<line x1="40" y1="300" x2="480" y2="300" stroke="#30363D" stroke-dasharray="4 4"/>
<line x1="260" y1="300" x2="450" y2="300" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
<text x="458" y="292" font-size="14" fill="#2DD4BF" font-weight="700" text-anchor="start">query</text>
<g><line x1="260" y1="300" x2="450" y2="300" stroke="#F5B042" stroke-width="4" stroke-linecap="round"/><text x="458" y="292" font-size="14" fill="#F5B042" font-weight="700" text-anchor="start">chunk</text>
<animateTransform attributeName="transform" type="rotate" dur="15s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0;0.036;0.2;0.236;0.4;0.436;0.6;0.636;0.8;0.836;1.0" values="-180 260 300;-10 260 300;-10 260 300;-45 260 300;-45 260 300;-90 260 300;-90 260 300;-135 260 300;-135 260 300;-180 260 300;-180 260 300"/></g>
<rect x="540" y="110" width="310" height="210" rx="14" fill="#161B22" stroke="#30363D"/>
<text x="695" y="142" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">score = cos(angle)</text>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.2;0.22;1" values="1;1;0;0"/><text x="695" y="205" font-size="46" fill="#F5B042" font-weight="700" text-anchor="middle">+0.98</text>
<text x="695" y="238" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">angle 10 degrees</text>
<text x="695" y="276" font-size="17" fill="#E6EDF3" font-weight="700" text-anchor="middle">almost the same meaning</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.18;0.2;0.4;0.42;1" values="0;0;1;1;0;0"/><text x="695" y="205" font-size="46" fill="#F5B042" font-weight="700" text-anchor="middle">+0.71</text>
<text x="695" y="238" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">angle 45 degrees</text>
<text x="695" y="276" font-size="17" fill="#E6EDF3" font-weight="700" text-anchor="middle">related</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.38;0.4;0.6;0.62;1" values="0;0;1;1;0;0"/><text x="695" y="205" font-size="46" fill="#F5B042" font-weight="700" text-anchor="middle">+0.00</text>
<text x="695" y="238" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">angle 90 degrees</text>
<text x="695" y="276" font-size="17" fill="#E6EDF3" font-weight="700" text-anchor="middle">unrelated</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.58;0.6;0.8;0.82;1" values="0;0;1;1;0;0"/><text x="695" y="205" font-size="46" fill="#F5B042" font-weight="700" text-anchor="middle">-0.71</text>
<text x="695" y="238" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">angle 135 degrees</text>
<text x="695" y="276" font-size="17" fill="#E6EDF3" font-weight="700" text-anchor="middle">leaning opposite</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.78;0.8;1.0" values="0;0;1;1"/><text x="695" y="205" font-size="46" fill="#F5B042" font-weight="700" text-anchor="middle">-1.00</text>
<text x="695" y="238" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">angle 180 degrees</text>
<text x="695" y="276" font-size="17" fill="#E6EDF3" font-weight="700" text-anchor="middle">opposite meaning</text>
</g>
<text x="695" y="302" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">1 = same direction, 0 = unrelated, -1 = opposite</text>
</svg>
