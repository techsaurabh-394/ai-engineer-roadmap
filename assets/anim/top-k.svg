<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. The model gives a probability to every token<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Here, 6 tokens. Real vocabularies have tens of thousands.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 1 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. With k = 3, keep only the 3 most likely tokens<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">The rest are thrown away.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 2 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. Rescale the kept tokens so they add up to 1<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">0.40, 0.25, 0.15 divided by 0.80. Sample from these.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 3 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
