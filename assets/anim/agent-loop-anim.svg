<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">The agent loop</title>
<desc id="d">An agent is a model + tools + memory in a loop.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9DA7B3"/></marker></defs>
<rect width="880" height="420" rx="16" fill="#0D1117"/>
<text x="440.0" y="40" font-size="22" fill="#E6EDF3" font-weight="700" text-anchor="middle">The agent loop</text>
<text x="440.0" y="64" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">An agent is a model + tools + memory in a loop.</text>
<line x1="440" y1="135" x2="690" y2="240" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)" opacity="0.9"/>
<line x1="690" y1="240" x2="440" y2="345" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)" opacity="0.9"/>
<line x1="440" y1="345" x2="190" y2="240" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)" opacity="0.9"/>
<line x1="190" y1="240" x2="440" y2="135" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)" opacity="0.9"/>
<rect x="365" y="110" width="150" height="50" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="#F5B042;#F5B042;#30363D;#30363D"/></rect>
<text x="440" y="141" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Goal</text>
<rect x="615" y="215" width="150" height="50" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="#30363D;#30363D;#F5B042;#F5B042;#30363D;#30363D"/></rect>
<text x="690" y="246" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Plan</text>
<rect x="365" y="320" width="150" height="50" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="#30363D;#30363D;#F5B042;#F5B042;#30363D;#30363D"/></rect>
<text x="440" y="351" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Act</text>
<rect x="115" y="215" width="150" height="50" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="#30363D;#30363D;#F5B042;#F5B042"/></rect>
<text x="190" y="246" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Observe</text>
<circle r="9" fill="#F5B042" cx="440.0" cy="99.0"><animate attributeName="cx" dur="9.6s" repeatCount="indefinite" keyTimes="0.0;0.0125;0.25;0.3375;0.5;0.5875;0.75;0.8375;1.0" values="440.0;440.0;440.0;690.0;690.0;440.0;440.0;190.0;190.0"/><animate attributeName="cy" dur="9.6s" repeatCount="indefinite" keyTimes="0.0;0.0125;0.25;0.3375;0.5;0.5875;0.75;0.8375;1.0" values="99.0;99.0;99.0;204.0;204.0;309.0;309.0;204.0;204.0"/></circle>
<text x="440" y="232" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. Receive the goal<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="440" y="256" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">For example: book the cheapest train.<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="440" y="232" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. Decide the next step<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440" y="256" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">The model picks a tool or answers.<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440" y="232" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. Run the tool<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="0;0;1;1;0;0"/></text>
<text x="440" y="256" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Your code executes it safely.<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="0;0;1;1;0;0"/></text>
<text x="440" y="232" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">4. Read the result<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="0;0;1;1"/></text>
<text x="440" y="256" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Add it to memory, then check if the goal is met.<animate attributeName="opacity" dur="9.6s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="0;0;1;1"/></text>
</svg>
