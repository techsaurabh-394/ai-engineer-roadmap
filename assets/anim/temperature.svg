<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. Low temperature (0.2): the top choice wins almost every time<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Safe and repeatable. Good for facts and code.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 1 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. Normal temperature (1.0): the model's own probabilities<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">The top choice wins often, but others get a chance.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 2 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. High temperature (2.0): the choices flatten out<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">More surprising, and more likely to go wrong.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 3 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
