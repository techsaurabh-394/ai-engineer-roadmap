<rect x="30" y="272" width="820" height="78" rx="12" fill="#161B22" stroke="#30363D"/>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. Sort tokens from most to least likely<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Same probabilities as the top-k example.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 1 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3453;1" values="1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. Add from the top until the total reaches 0.90<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">0.40, 0.65, 0.80, 0.90. So keep 4 tokens.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 2 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. Rescale the kept tokens to add up to 1<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Sample from these 4. The group size adapts to each situation.<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 3 of 3<animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;1.0" values="0;0;1;1"/></text>
