<rect x="30" y="104" width="128" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.2;0.212;1" values="#2DD4BF;#2DD4BF;#30363D;#30363D"/></rect>
