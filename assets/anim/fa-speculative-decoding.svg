<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Speculative decoding</title>
<desc id="d">A cheap draft guesses, the big model checks in one pass.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9DA7B3"/></marker></defs>
<rect width="880" height="330" rx="16" fill="#0D1117"/>
<text x="440.0" y="40" font-size="22" fill="#E6EDF3" font-weight="700" text-anchor="middle">Speculative decoding</text>
<text x="440.0" y="64" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">A cheap draft guesses, the big model checks in one pass.</text>
<line x1="150" y1="150" x2="166.4" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="290.4" y1="150" x2="306.8" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="430.8" y1="150" x2="447.2" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="571.2" y1="150" x2="587.6" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="711.6" y1="150" x2="728" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="104" width="118" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1667;0.1787;1" values="#6EA8FE;#6EA8FE;#30363D;#30363D"/></rect>
<circle cx="48" cy="104" r="13" fill="#6EA8FE"/><text x="48" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">1</text>
<text x="89" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Draft</text>
<text x="89" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">small model</text>
<rect x="170.4" y="104" width="118" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1547;0.1667;0.3333;0.3453;1" values="#30363D;#30363D;#6EA8FE;#6EA8FE;#30363D;#30363D"/></rect>
<circle cx="188.4" cy="104" r="13" fill="#6EA8FE"/><text x="188.4" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">2</text>
<text x="229.4" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Verify</text>
<text x="229.4" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">one big pass</text>
<rect x="310.8" y="104" width="118" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.5;0.512;1" values="#30363D;#30363D;#6EA8FE;#6EA8FE;#30363D;#30363D"/></rect>
<circle cx="328.8" cy="104" r="13" fill="#6EA8FE"/><text x="328.8" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">3</text>
<text x="369.8" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Keep</text>
<text x="369.8" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">agreed prefix</text>
<rect x="451.2" y="104" width="118" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.6667;0.6787;1" values="#30363D;#30363D;#6EA8FE;#6EA8FE;#30363D;#30363D"/></rect>
<circle cx="469.2" cy="104" r="13" fill="#6EA8FE"/><text x="469.2" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">4</text>
<text x="510.2" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Bonus</text>
<text x="510.2" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">+1 token</text>
<rect x="591.6" y="104" width="118" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;0.8333;0.8453;1" values="#30363D;#30363D;#6EA8FE;#6EA8FE;#30363D;#30363D"/></rect>
<circle cx="609.6" cy="104" r="13" fill="#6EA8FE"/><text x="609.6" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">5</text>
<text x="650.6" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Maths</text>
<text x="650.6" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">a = 0.7, k = 4</text>
<rect x="732" y="104" width="118" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.8213;0.8333;1.0" values="#30363D;#30363D;#6EA8FE;#6EA8FE"/></rect>
<circle cx="750" cy="104" r="13" fill="#6EA8FE"/><text x="750" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">6</text>
<text x="791" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Risk</text>
<text x="791" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">weak draft</text>
<circle r="9" fill="#F5B042" cx="89" cy="88"><animate attributeName="cx" dur="14.4s" repeatCount="indefinite" keyTimes="0.0;0.0083;0.1667;0.225;0.3333;0.3917;0.5;0.5583;0.6667;0.725;0.8333;0.8917;1.0" values="89;89;89;229.4;229.4;369.8;369.8;510.2;510.2;650.6;650.6;791;791"/><animate attributeName="cy" dur="14.4s" repeatCount="indefinite" keyTimes="0.0;0.0083;0.1667;0.225;0.3333;0.3917;0.5;0.5583;0.6667;0.725;0.8333;0.8917;1.0" values="88;88;88;88;88;88;88;88;88;88;88;88;88"/></circle>
<rect x="30" y="226" width="820" height="84" rx="12" fill="#161B22" stroke="#30363D"/>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. A small model proposes k tokens<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1667;0.1787;1" values="1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">It is quick, and often right on predictable text.<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1667;0.1787;1" values="1;1;0;0"/></text>
<text x="836" y="300" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 1 of 6<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1667;0.1787;1" values="1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. The big model scores all k positions at once<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1547;0.1667;0.3333;0.3453;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Checking k tokens costs about as much as making one.<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1547;0.1667;0.3333;0.3453;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="300" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 2 of 6<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1547;0.1667;0.3333;0.3453;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. Keep tokens up to the first disagreement<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">At a mismatch the big model's own token is used.<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="300" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 3 of 6<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.3213;0.3333;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">4. The big model adds one token of its own<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">So each round yields 1 to k + 1 tokens.<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="300" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 4 of 6<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.6667;0.6787;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">5. Expected 2.773 tokens per big-model pass<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;0.8333;0.8453;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">That is 1.98x faster when the draft costs 10 percent.<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;0.8333;0.8453;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="300" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 5 of 6<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.6547;0.6667;0.8333;0.8453;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">6. A poor draft can be slower than none<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.8213;0.8333;1.0" values="0;0;1;1"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">a = 0.3 at 40 percent cost gives 0.55x.<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.8213;0.8333;1.0" values="0;0;1;1"/></text>
<text x="836" y="300" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 6 of 6<animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.8213;0.8333;1.0" values="0;0;1;1"/></text>
</svg>
