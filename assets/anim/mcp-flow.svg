<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">MCP: how an AI app uses a tool server</title>
<desc id="d">One standard way to plug tools into any AI app.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9DA7B3"/></marker></defs>
<rect width="880" height="330" rx="16" fill="#0D1117"/>
<text x="440.0" y="40" font-size="22" fill="#E6EDF3" font-weight="700" text-anchor="middle">MCP: how an AI app uses a tool server</text>
<text x="440.0" y="64" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">One standard way to plug tools into any AI app.</text>
<line x1="160.0" y1="150" x2="199.0" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="333.0" y1="150" x2="372.0" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="506.0" y1="150" x2="545.0" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="679.0" y1="150" x2="718.0" y2="150" stroke="#30363D" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30.0" y="104" width="128" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.2;0.212;1" values="#F472B6;#F472B6;#30363D;#30363D"/></rect>
<circle cx="48.0" cy="104" r="13" fill="#F472B6"/><text x="48.0" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">1</text>
<text x="94.0" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Host app</text>
<text x="94.0" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">Claude, IDE...</text>
<rect x="203.0" y="104" width="128" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.188;0.2;0.4;0.412;1" values="#30363D;#30363D;#F472B6;#F472B6;#30363D;#30363D"/></rect>
<circle cx="221.0" cy="104" r="13" fill="#F472B6"/><text x="221.0" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">2</text>
<text x="267.0" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Connect</text>
<text x="267.0" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">handshake</text>
<rect x="376.0" y="104" width="128" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.388;0.4;0.6;0.612;1" values="#30363D;#30363D;#F472B6;#F472B6;#30363D;#30363D"/></rect>
<circle cx="394.0" cy="104" r="13" fill="#F472B6"/><text x="394.0" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">3</text>
<text x="440.0" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">List</text>
<text x="440.0" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">tools/list</text>
<rect x="549.0" y="104" width="128" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.588;0.6;0.8;0.812;1" values="#30363D;#30363D;#F472B6;#F472B6;#30363D;#30363D"/></rect>
<circle cx="567.0" cy="104" r="13" fill="#F472B6"/><text x="567.0" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">4</text>
<text x="613.0" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Call</text>
<text x="613.0" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">tools/call</text>
<rect x="722.0" y="104" width="128" height="92" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"><animate attributeName="stroke" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.788;0.8;1.0" values="#30363D;#30363D;#F472B6;#F472B6"/></rect>
<circle cx="740.0" cy="104" r="13" fill="#F472B6"/><text x="740.0" y="109" font-size="14" fill="#0D1117" font-weight="700" text-anchor="middle">5</text>
<text x="786.0" y="146" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Result</text>
<text x="786.0" y="170" font-size="12.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">content back</text>
<circle r="9" fill="#F5B042" cx="94.0" cy="88"><animate attributeName="cx" dur="12.0s" repeatCount="indefinite" keyTimes="0.0;0.01;0.2;0.27;0.4;0.47;0.6;0.67;0.8;0.87;1.0" values="94.0;94.0;94.0;267.0;267.0;440.0;440.0;613.0;613.0;786.0;786.0"/><animate attributeName="cy" dur="12.0s" repeatCount="indefinite" keyTimes="0.0;0.01;0.2;0.27;0.4;0.47;0.6;0.67;0.8;0.87;1.0" values="88;88;88;88;88;88;88;88;88;88;88"/></circle>
<rect x="30" y="226" width="820" height="84" rx="12" fill="#161B22" stroke="#30363D"/>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. The host app starts an MCP client<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.2;0.212;1" values="1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">The host is the AI app you use.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.2;0.212;1" values="1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. Client and server agree on features<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.188;0.2;0.4;0.412;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">They exchange name, version and capabilities.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.188;0.2;0.4;0.412;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. The client asks: what can you do?<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.388;0.4;0.6;0.612;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">The server returns tools with descriptions and schemas.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.388;0.4;0.6;0.612;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">4. The model picks a tool and the client calls it<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.588;0.6;0.8;0.812;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Inputs follow the tool's JSON schema.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.588;0.6;0.8;0.812;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="258" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">5. The server returns the result<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.788;0.8;1.0" values="0;0;1;1"/></text>
<text x="440.0" y="282" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">The model reads it and continues.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.788;0.8;1.0" values="0;0;1;1"/></text>
</svg>
