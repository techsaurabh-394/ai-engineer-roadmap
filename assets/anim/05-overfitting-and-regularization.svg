<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. A straight line underfits: validation error 0.45<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">It is too simple to follow a sine wave.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 1 of 4<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. Degrees 3 to 5 do best: validation error about 0.16<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">Flexible enough, but not too flexible.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 2 of 4<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. Degree 8 climbs to 0.21; degree 9 reaches 3.29 (off this chart)<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">It memorises the 10 training points and the noise.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="0;0;1;1;0;0"/></text>
