<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">4. Degree 9 with a small L2 penalty: validation error 0.16<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="0;0;1;1"/></text>
