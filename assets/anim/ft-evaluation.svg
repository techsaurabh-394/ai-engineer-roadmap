<text x="840" y="100" font-size="18" fill="#6EA8FE" font-weight="700" text-anchor="end" opacity="0">Regressions<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="0;0;1;1"/></text>
<rect x="30" y="272" width="820" height="78" rx="12" fill="#161B22" stroke="#30363D"/>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">1. Score the base model on held-out questions<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">It is the baseline: 0.42 exact match, 0.50 F1.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 1 of 4<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.25;0.262;1" values="1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">2. Score the tuned model on the same questions<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">0.92 exact match, 0.99 F1, and it wins 7 of 12.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 2 of 4<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.5;0.512;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">3. Put a confidence interval around the gain<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">12 questions is few: the range is wide, so grow the set.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="0;0;1;1;0;0"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 3 of 4<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.75;0.762;1" values="0;0;1;1;0;0"/></text>
<text x="440.0" y="303" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="middle" opacity="0">4. Look for answers that got worse<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="0;0;1;1"/></text>
<text x="440.0" y="327" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle" opacity="0">One question regressed: an average hides it.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="0;0;1;1"/></text>
<text x="836" y="342" font-size="12" fill="#9DA7B3" text-anchor="end" opacity="0">Step 4 of 4<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.738;0.75;1.0" values="0;0;1;1"/></text>
