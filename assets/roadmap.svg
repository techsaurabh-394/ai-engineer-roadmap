<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Learning path: RAG Basics, Advanced RAG, LLM Concepts, Agentic AI, Frameworks, MCP, Production, Interview, Projects">
<title>Learning path overview</title>
<desc>Animated overview of the learning path: RAG basics, advanced RAG, LLM concepts, agentic AI, frameworks, MCP, production, interview prep and projects.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#241552"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.s{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
@keyframes flow{to{stroke-dashoffset:-40}}
.path{animation:flow 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="1200" height="340" rx="18" fill="url(#bg)"/>
<text x="600" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">Your learning path: basic to advanced</text>
<polyline points="80,130 210,210 340,130 470,210 600,130 730,210 860,130 990,210 1120,130" fill="none" stroke="#3a4170" stroke-width="5" stroke-linejoin="round"/>
<polyline class="path" points="80,130 210,210 340,130 470,210 600,130 730,210 860,130 990,210 1120,130" fill="none" stroke="#6ea8fe" stroke-width="3" stroke-dasharray="10 10" stroke-linejoin="round"/>
<g class="s" style="animation-delay:0.30s"><circle cx="80" cy="130" r="26" fill="url(#ac)"/><text x="80" y="137" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">1</text><text x="80" y="182" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">RAG Basics</text></g>
<g class="s" style="animation-delay:0.60s"><circle cx="210" cy="210" r="26" fill="url(#ac)"/><text x="210" y="217" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">2</text><text x="210" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">Advanced RAG</text></g>
<g class="s" style="animation-delay:0.90s"><circle cx="340" cy="130" r="26" fill="url(#ac)"/><text x="340" y="137" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">3</text><text x="340" y="182" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">LLM Concepts</text></g>
<g class="s" style="animation-delay:1.20s"><circle cx="470" cy="210" r="26" fill="url(#ac)"/><text x="470" y="217" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">4</text><text x="470" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">Agentic AI</text></g>
<g class="s" style="animation-delay:1.50s"><circle cx="600" cy="130" r="26" fill="url(#ac)"/><text x="600" y="137" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">5</text><text x="600" y="182" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">Frameworks</text></g>
<g class="s" style="animation-delay:1.80s"><circle cx="730" cy="210" r="26" fill="url(#ac)"/><text x="730" y="217" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">6</text><text x="730" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">MCP</text></g>
<g class="s" style="animation-delay:2.10s"><circle cx="860" cy="130" r="26" fill="url(#ac)"/><text x="860" y="137" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">7</text><text x="860" y="182" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">Production</text></g>
<g class="s" style="animation-delay:2.40s"><circle cx="990" cy="210" r="26" fill="url(#ac)"/><text x="990" y="217" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">8</text><text x="990" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">Interview</text></g>
<g class="s" style="animation-delay:2.70s"><circle cx="1120" cy="130" r="26" fill="url(#ac)"/><text x="1120" y="137" text-anchor="middle" font-size="21" font-weight="800" fill="#0b1020">9</text><text x="1120" y="182" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e8ee">Projects</text></g>
</svg>
