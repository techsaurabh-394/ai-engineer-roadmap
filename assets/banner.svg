<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AI Engineer Roadmap by Saurabh Pathak">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#241552"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#c084fc"/></linearGradient><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b93a7"/></marker></defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.o1{animation:drift 7s ease-in-out infinite}.o2{animation:drift 9s ease-in-out infinite reverse}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.a{animation:rise .9s ease-out both}.b{animation:rise .9s .3s ease-out both}.c{animation:rise .9s .6s ease-out both}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<g opacity=".6"><circle class="o1" cx="1020" cy="80" r="95" fill="#6ea8fe" opacity=".18"/><circle class="o2" cx="930" cy="250" r="62" fill="#c084fc" opacity=".22"/></g>
<g stroke="rgba(255,255,255,.05)"><path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200M120 0V320M360 0V320M600 0V320M840 0V320M1080 0V320"/></g>
<text class="a" x="70" y="112" font-size="58" font-weight="800" fill="#fff">AI Engineer Roadmap</text>
<rect class="a" x="72" y="130" width="170" height="5" rx="2.5" fill="url(#ac)"/>
<text class="b" x="72" y="180" font-size="26" font-weight="600" fill="url(#ac)">LLMs → RAG → Agents → MCP → Production</text>
<text class="b" x="72" y="218" font-size="20" fill="#c8cede">Learn step by step, with runnable code and animated diagrams<tspan class="cur" fill="#6ea8fe"> ▍</tspan></text>
<text class="c" x="72" y="272" font-size="17" fill="#8b93a7">By Saurabh Pathak · AI Engineer &amp; Full-Stack Developer · github.com/techsaurabh-394</text>
</svg>
