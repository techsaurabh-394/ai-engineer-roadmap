<text x="106" y="136" font-size="17" font-weight="700" fill="#E6EDF3">ML Foundations</text>
<text x="106" y="157" font-size="12.5" fill="#9DA7B3">gradient descent, neural nets, backprop, overfitting</text>
<text x="464" y="136" font-size="13" font-weight="600" text-anchor="end" fill="#7b8794">5 topics</text>
<rect x="520" y="110" width="440" height="62" rx="12" fill="#161B22" stroke="#30363D"/>
<rect x="520" y="110" width="8" height="62" rx="4" fill="#e34948"/>
