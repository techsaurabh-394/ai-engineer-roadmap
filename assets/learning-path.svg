<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 686" width="1000" height="686" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Learning path: 11 phases, 138 topics, from zero to production</title>
<desc id="d">Eleven phases in order: ML Foundations 5 topics, RAG Foundations 20 topics, Advanced RAG 21 topics, LLM Concepts 26 topics, Agentic AI 16 topics, Frameworks 8 topics, MCP 7 topics, Production AI 15 topics, Fine-tuning 7 topics, Multimodal AI 7 topics, Frontier AI Engineering 6 topics, followed by interview prep and projects.</desc>
<rect width="1000" height="686" rx="18" fill="#0D1117"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#E6EDF3">From zero to production: 11 phases, 138 topics</text>
<text x="40" y="80" font-size="14" fill="#9DA7B3">Do them in order. Phase 0 is an optional warm-up if you already know basic machine learning.</text>
<rect x="40" y="110" width="440" height="62" rx="12" fill="#161B22" stroke="#30363D"/>
<rect x="40" y="110" width="8" height="62" rx="4" fill="#7b8794"/>
