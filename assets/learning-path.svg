<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 694" width="880" height="694" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Learning path: 7 phases, 100 topics, from zero to production</title>
<desc id="d">Seven phases in order: RAG Foundations 20 topics, Advanced RAG 20, LLM Concepts 14, Agentic AI 16, Frameworks 8, MCP 7 and Production AI 15, followed by interview prep and projects.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker></defs>
<rect width="880" height="694" rx="16" fill="#0D1117"/>
<text x="440" y="38" font-size="22" fill="#E6EDF3" font-weight="700" text-anchor="middle">From zero to production: 7 phases, 100 topics</text>
<rect x="30" y="56" width="150" height="36" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="105" y="80" font-size="15" fill="#FBBF24" font-weight="700" text-anchor="middle">You: zero</text>
<line x1="105" y1="92" x2="105" y2="112" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="30" y="112" width="820" height="60" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="66" cy="142" r="18" fill="#2DD4BF"/>
<text x="66" y="148.3" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">1</text>
<text x="100" y="138" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">RAG Foundations</text>
<text x="100" y="159" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="start">embeddings, chunking, vector search, BM25, hybrid search</text>
<rect x="742" y="126" width="92" height="32" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="788" y="148" font-size="14.5" fill="#FBBF24" font-weight="700" text-anchor="middle">20 topics</text>
<line x1="66" y1="172" x2="66" y2="184" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="184" width="820" height="60" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="66" cy="214" r="18" fill="#2DD4BF"/>
<text x="66" y="220.3" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">2</text>
<text x="100" y="210" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">Advanced RAG</text>
<text x="100" y="231" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="start">reranking, query rewriting, HyDE, GraphRAG, RAG evaluation</text>
<rect x="742" y="198" width="92" height="32" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="788" y="220" font-size="14.5" fill="#FBBF24" font-weight="700" text-anchor="middle">20 topics</text>
<line x1="66" y1="244" x2="66" y2="256" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="256" width="820" height="60" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="66" cy="286" r="18" fill="#2DD4BF"/>
<text x="66" y="292.3" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">3</text>
<text x="100" y="282" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">LLM Concepts</text>
<text x="100" y="303" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="start">transformers, attention, KV cache, sampling, prompting</text>
<rect x="742" y="270" width="92" height="32" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="788" y="292" font-size="14.5" fill="#FBBF24" font-weight="700" text-anchor="middle">14 topics</text>
<line x1="66" y1="316" x2="66" y2="328" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="328" width="820" height="60" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="66" cy="358" r="18" fill="#2DD4BF"/>
<text x="66" y="364.3" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">4</text>
<text x="100" y="354" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">Agentic AI</text>
<text x="100" y="375" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="start">tool calling, ReAct, memory, multi-agent, guardrails</text>
<rect x="742" y="342" width="92" height="32" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="788" y="364" font-size="14.5" fill="#FBBF24" font-weight="700" text-anchor="middle">16 topics</text>
<line x1="66" y1="388" x2="66" y2="400" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="400" width="820" height="60" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="66" cy="430" r="18" fill="#2DD4BF"/>
<text x="66" y="436.3" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">5</text>
<text x="100" y="426" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">Frameworks</text>
<text x="100" y="447" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="start">LangChain, LangGraph, LlamaIndex, CrewAI, AutoGen, DSPy and more</text>
<rect x="742" y="414" width="92" height="32" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="788" y="436" font-size="14.5" fill="#FBBF24" font-weight="700" text-anchor="middle">8 topics</text>
<line x1="66" y1="460" x2="66" y2="472" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="472" width="820" height="60" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="66" cy="502" r="18" fill="#2DD4BF"/>
<text x="66" y="508.3" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">6</text>
<text x="100" y="498" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">MCP</text>
<text x="100" y="519" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="start">Model Context Protocol: servers, clients, tools, resources, prompts</text>
<rect x="742" y="486" width="92" height="32" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="788" y="508" font-size="14.5" fill="#FBBF24" font-weight="700" text-anchor="middle">7 topics</text>
<line x1="66" y1="532" x2="66" y2="544" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="544" width="820" height="60" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="2"/>
<circle cx="66" cy="574" r="18" fill="#FBBF24"/>
<text x="66" y="580.3" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">7</text>
<text x="100" y="570" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">Production AI</text>
<text x="100" y="591" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="start">FastAPI, Docker, Kubernetes, queues, monitoring, security, cost</text>
<rect x="742" y="558" width="92" height="32" rx="12" fill="#0D1117" stroke="#FBBF24" stroke-width="1.5"/>
<text x="788" y="580" font-size="14.5" fill="#FBBF24" font-weight="700" text-anchor="middle">15 topics</text>
<text x="440" y="642" font-size="15" fill="#E6EDF3" font-weight="600" text-anchor="middle">Then practise: 08 Interview prep (43 questions + 4 system-design prompts) and 09 Projects</text>
<text x="440" y="666" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">Goal: you can build, explain and run an AI app in production</text>
</svg>
