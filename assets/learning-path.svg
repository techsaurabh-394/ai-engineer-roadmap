<text x="586" y="136" font-size="17" font-weight="700" fill="#E6EDF3">RAG Foundations</text>
<text x="586" y="157" font-size="12.5" fill="#9DA7B3">embeddings, chunking, vector search, BM25, hybrid</text>
<text x="944" y="136" font-size="13" font-weight="600" text-anchor="end" fill="#e34948">20 topics</text>
<rect x="40" y="186" width="440" height="62" rx="12" fill="#161B22" stroke="#30363D"/>
<rect x="40" y="186" width="8" height="62" rx="4" fill="#2a78d6"/>
