<text x="771" y="112" font-size="18" fill="#FBBF24" font-weight="700" text-anchor="middle">Day 5</text>
<text x="771" y="144" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">System design</text>
<text x="771" y="164" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">prompts</text>
<text x="771" y="224" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle">4 prompts</text>
<rect x="30" y="276" width="820" height="120" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="1.5"/>
<text x="50" y="306" font-size="17" fill="#2DD4BF" font-weight="700" text-anchor="start">How to practise each day</text>
<text x="50" y="334" font-size="15" fill="#E6EDF3" font-weight="400" text-anchor="start">1. Read a question and answer out loud for 60 seconds. Then read the answer.</text>
<text x="50" y="358" font-size="15" fill="#E6EDF3" font-weight="400" text-anchor="start">2. For each answer, prepare one example from something you built.</text>
<text x="50" y="382" font-size="15" fill="#E6EDF3" font-weight="400" text-anchor="start">3. Day 5: do each system-design prompt in 10 to 15 minutes, with a friend or a timer.</text>
<rect x="30" y="414" width="400" height="92" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="1.5"/>
<text x="230" y="444" font-size="16" fill="#FBBF24" font-weight="700" text-anchor="middle">Day before the interview</text>
<text x="230" y="468" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">Re-read the 3 questions at the end of each</text>
<text x="230" y="488" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">topic page in one phase.</text>
<rect x="450" y="414" width="400" height="92" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="1.5"/>
<text x="650" y="444" font-size="16" fill="#FBBF24" font-weight="700" text-anchor="middle">Total in 08-interview-prep</text>
<text x="650" y="468" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">43 questions plus 4 system-design prompts,</text>
<text x="650" y="488" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">in 5 files.</text>
<text x="440" y="540" font-size="14.5" fill="#9DA7B3" font-weight="400" text-anchor="middle">Answers are short on purpose. Check current docs where a topic moves fast.</text>
