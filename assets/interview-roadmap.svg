<text x="439" y="224" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle">12 questions</text>
<line x1="516" y1="167" x2="528" y2="167" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="528" y="82" width="154" height="170" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
