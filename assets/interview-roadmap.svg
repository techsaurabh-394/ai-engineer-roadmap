<title id="t">One week of interview prep with 08-interview-prep</title>
<desc id="d">Five days, one file per day: LLM fundamentals 10 questions, RAG 13, AI agents and MCP 12, evaluation and production 8, and 4 system-design prompts. Total 43 questions plus 4 prompts.</desc>
