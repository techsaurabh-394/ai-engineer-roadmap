<text x="605" y="224" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle">8 questions</text>
<line x1="682" y1="167" x2="694" y2="167" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
